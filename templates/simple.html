<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Fake News Detector - AOL MLOps</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; background-color: #f4f6f9; color: #333; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #007BFF; text-align: center; }
        p { color: #666; text-align: center; margin-bottom: 25px; }
        textarea { width: 100%; height: 140px; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; resize: vertical; font-size: 14px; }
        button { width: 100%; padding: 12px; background-color: #007BFF; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; transition: background 0.2s; }
        button:hover { background-color: #0056b3; }
        #result-box { margin-top: 25px; padding: 15px; border-radius: 6px; display: none; text-align: center; font-size: 1.2em; font-weight: bold; }
        .true-news { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fake-news { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Deteksi Berita Palsu</h2>
        <p>Tugas AOL Machine Learning Operations (MLOps)</p>
        <textarea id="newsText" placeholder="Tempel atau ketik kalimat berita bahasa Inggris di sini..."></textarea>
        <button onclick="checkNews()">Analisis Berita</button>
        <div id="result-box"></div>
    </div>

    <script>
        async function checkNews() {
            const text = document.getElementById('newsText').value;
            if(!text.trim()) { alert("Teks tidak boleh kosong!"); return; }
            
            const resultBox = document.getElementById('result-box');
            resultBox.style.display = "block";
            resultBox.className = ""; 
            resultBox.innerText = "Sedang menganalisis...";

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await response.json();
                
                if (data.error) {
                    resultBox.className = "fake-news";
                    resultBox.innerText = "Perhatian: " + data.error;
                    return;
                }

                if (data.prediction && data.prediction.includes("True")) {
                    resultBox.className = "true-news";
                    resultBox.innerText = "Hasil: " + data.prediction;
                } else if (data.prediction) {
                    resultBox.className = "fake-news";
                    resultBox.innerText = "Hasil: " + data.prediction;
                }
            } catch (error) {
                resultBox.innerText = "Gagal terhubung ke API Flask.";
            }
        }
    </script>
</body>
</html>
